name: Build synthetic dataset

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-synthetic-dataset.yml"
      - "scripts/build_synthetic_dataset.py"
  workflow_dispatch:
    inputs:
      per_split:
        description: Source receipts per split (1–100)
        required: true
        type: number
        default: 10
      seed:
        description: Deterministic generator seed
        required: true
        type: number
        default: 20261127

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install generator dependency
        run: python -m pip install "Pillow>=10.4,<13.0"
      - name: Generate synthetic dataset
        env:
          PER_SPLIT: ${{ inputs.per_split || 10 }}
          DATASET_SEED: ${{ inputs.seed || 20261127 }}
        run: >-
          python scripts/build_synthetic_dataset.py
          --output data/synthetic
          --per-split "$PER_SPLIT"
          --seed "$DATASET_SEED"
      - name: Upload dataset artifact
        uses: actions/upload-artifact@v6
        with:
          name: buktiscope-synthetic-dataset-${{ github.run_number }}
          path: data/synthetic/
          if-no-files-found: error
          retention-days: 7
